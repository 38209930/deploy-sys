# pipeline-name: etbst-api-发布
#
# 云效 Flow 流水线定义（etbst-api 试点）。
# 创建/更新：FLOW_PIPELINE_ID=<已有ID> bash scripts/flow-release.sh apply deployment/flow/pipeline-etbst-api.yaml
#
# 带 <> 的占位符在云效控制台创建对应服务连接后替换（见 deployment/flow-release-commands.md 清单）：
#   <CODEUP_SC>  Codeup 服务连接 ID（需能访问 ddmp/et-bst-api 仓库）
#   ACR 服务连接 lhjkwns3zhj879ic 已对 power-application-user 可见，推送能力待验证
#   <ACK_SC>     容器服务 Kubernetes 集群（cebc88343a44b4d759aa983a47b787835）服务连接 ID
#
# ACR 企业版构建及 Kubernetes 镜像更新步骤已按云效官方步骤清单核对；digest 传递仍待验证。

sources:
  etbst_repo:
    type: codeup
    name: et-bst-api
    endpoint: https://codeup.aliyun.com/659a5cefd64a2eb2dceb72f3/ddmp/et-bst-api.git
    branch: release
    triggerEvents: []            # 手动触发（本地 flow-release.sh build），不做 push 自动构建
    certificate:
      type: serviceConnection
      serviceConnection: <CODEUP_SC>

stages:
  build_stage:
    name: 构建并推送镜像
    jobs:
      build_job:
        name: etbst-api-镜像
        runsOn: public/cn-beijing
        steps:
          acr_push:
            name: 构建镜像并推送ACR企业版
            step: ACREEDockerBuild   # 仓库根 Dockerfile 多阶段构建
            with:
              serviceConnection: lhjkwns3zhj879ic
              region: cn-beijing
              artifact: etbst_api_image
              instance: ruishi-prod
              namespace: ruishi-java-prod
              dockerRegistry: etbst-api
              dockerTag: "${DATETIME}-${CI_COMMIT_ID}"   # Tag 不可变，禁止复用
              dockerfilePath: Dockerfile

  confirm_stage:
    name: 人工确认
    jobs:
      confirm_job:
        name: 上线前确认           # 本地 flow-release.sh deploy 通过该卡点
        <人工确认任务，apply 时按云效当前语法配置>

  deploy_stage:
    name: 部署ACS
    jobs:
      deploy_job:
        name: 更新ACS镜像
        runsOn: public/cn-beijing
        steps:
          k8s_set_image:
            name: 固定digest更新Deployment
            step: KubectlSetImage
            with:
              kubernetesCluster: <ACK_SC>
              kubectlVersion: "1.27.9"
              namespace: etbst-api
              workloadKind: deployment
              workload: etbst-api
              container: <ACS_CONTAINER_NAME>
              # 必须传入构建后查询并校验的 digest 地址；不能传 ACR 步骤产出的 tag 地址。
              artifact: <IMAGE_DIGEST_REF>
