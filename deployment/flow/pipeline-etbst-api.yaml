# pipeline-name: etbst-api-发布
#
# 云效 Flow 流水线定义（etbst-api 试点）。
# 创建/更新：FLOW_PIPELINE_ID=<已有ID> bash scripts/flow-release.sh apply deployment/flow/pipeline-etbst-api.yaml
#
# 带 <> 的占位符在云效全局设置 > Kubernetes 集群管理注册集群后替换：
#   Codeup 服务连接 xdghn746erjk8hdo 已对 power-application-user 可见，实际拉取待验证
#   ACR 服务连接 lhjkwns3zhj879ic 已对 power-application-user 可见，推送能力待验证
#   ACK 服务连接 fmayt57b9ttcjq61 已对 power-application-user 可见
#   <FLOW_K8S_CLUSTER_ID> 必须是 Flow 注册后的集群 ID，不能填 ACK 服务连接 ID 或 ACS 集群 ID
#
# digest 从构建后 Docker RepoDigests 提取，经全局变量传到部署任务；需首次运行验证。

sources:
  etbst_repo:
    type: codeup
    name: et-bst-api
    endpoint: https://codeup.aliyun.com/659a5cefd64a2eb2dceb72f3/ddmp/et-bst-api.git
    branch: release
    triggerEvents: []            # 手动触发（本地 flow-release.sh build），不做 push 自动构建
    certificate:
      type: serviceConnection
      serviceConnection: xdghn746erjk8hdo

stages:
  build_stage:
    name: 构建并推送镜像
    jobs:
      build_job:
        name: etbst-api-镜像
        runsOn: public/cn-beijing
        steps:
          acr_push:
            name: 构建镜像并推送ACR企业版
            step: ACREEDockerBuild   # 仓库根 Dockerfile 多阶段构建
            with:
              serviceConnection: lhjkwns3zhj879ic
              region: cn-beijing
              artifact: etbst_api_image
              instance: ruishi-prod
              namespace: ruishi-java-prod
              dockerRegistry: etbst-api
              dockerTag: "${DATETIME}-${CI_COMMIT_ID}"   # Tag 不可变，禁止复用
              dockerfilePath: Dockerfile
          resolve_digest:
            name: 提取并校验本次镜像digest
            step: Command
            with:
              run: |
                set -eu
                image_tag='$[stages.build_stage.build_job.acr_push.artifacts.etbst_api_image.dockerUrl]'
                digest_ref="$(docker image inspect --format '{{json .RepoDigests}}' "$image_tag" | python3 -c '
                import json, sys
                tag = sys.argv[1]
                repo = tag.rsplit(":", 1)[0]
                candidates = [x for x in json.load(sys.stdin) if x.startswith(repo + "@sha256:")]
                if len(candidates) != 1 or len(candidates[0].split("@sha256:", 1)[1]) != 64:
                    raise SystemExit("本次镜像没有唯一的 sha256 RepoDigest")
                print(candidates[0])
                ' "$image_tag")"
                printf 'USER_IMAGE_DIGEST_REF=%s\n' "$digest_ref" >> "$FLOW_ENV"
          publish_digest:
            name: 传递固定digest
            step: SetVariables
            with:
              key: IMAGE_DIGEST_REF
              value: "${USER_IMAGE_DIGEST_REF}"

  confirm_stage:
    name: 人工确认
    jobs:
      confirm_job:
        name: 上线前确认           # 本地 flow-release.sh deploy 通过该卡点
        component: ManualValidate
        with:
          validatorType: users
          validateMethod: and
          validators:
            - 203420990220401362

  deploy_stage:
    name: 部署ACS
    jobs:
      deploy_job:
        name: 更新ACS镜像
        runsOn: public/cn-beijing
        steps:
          k8s_set_image:
            name: 固定digest更新Deployment
            step: KubectlSetImage
            with:
              kubernetesCluster: <FLOW_K8S_CLUSTER_ID>
              kubectlVersion: "1.27.9"
              namespace: etbst-api
              workloadKind: deployment
              workload: etbst-api
              container: etbst-api  # 仓库命名推断，首次上线前必须回读现网 Deployment 核对
              # 首次上线前还需与 ACR API 及现网 Deployment 分别核对 digest、容器名。
              artifact: "${IMAGE_DIGEST_REF}"
